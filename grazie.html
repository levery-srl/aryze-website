<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARyze — Richiesta ricevuta</title>
  <link rel="icon" type="image/png" href="logo.jpg" />

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3KMV018LXB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3KMV018LXB');
    gtag('event', 'conversion', { 'event_category': 'lead', 'event_label': 'demo_request' });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --teal: #00B5A3;
      --ink:  #0F1F1E;
      --white: #FFFFFF;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--ink);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }

    .check-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0,181,163,0.12);
      border: 2px solid rgba(0,181,163,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 32px;
      animation: pop 0.4s ease both;
    }

    @keyframes pop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    img.logo { height: 32px; margin-bottom: 48px; opacity: 0.7; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    h1 span { color: var(--teal); }

    p {
      font-size: 17px;
      font-weight: 300;
      line-height: 1.7;
      color: rgba(255,255,255,0.6);
      max-width: 480px;
      margin: 0 auto 40px;
    }

    a.btn {
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 14px 32px;
      background: var(--teal);
      color: var(--ink);
      border-radius: 100px;
      text-decoration: none;
      transition: all 0.2s;
      display: inline-block;
    }
    a.btn:hover { background: #008F80; color: var(--white); }

    .footer-note {
      margin-top: 64px;
      font-size: 11px;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <img class="logo" src="logo-scritta-small.png" alt="ARyze" />

  <div class="check-circle">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <path d="M9 18l6 6 12-12" stroke="#00B5A3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>Richiesta <span>ricevuta.</span></h1>
  <p>Grazie per il tuo interesse in ARyze. Ti risponderemo entro 24 ore lavorative per fissare la tua demo gratuita.</p>

  <a class="btn" href="index.html">Torna alla home</a>

  <div class="footer-note">
    &copy; 2025 ARyze &mdash; Levery S.r.l. + Exvirience S.r.l.
  </div>
</body>
</html>
